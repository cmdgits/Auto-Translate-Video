[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-translate-video"
version = "0.1.0"
description = "CapCut-inspired local video translation pipeline for Vietnamese subtitles."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "edge-tts>=7.2.0",
  "fastapi>=0.116.0",
  "faster-whisper>=1.1.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.6",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.2",
  "rich>=14.0.0",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
